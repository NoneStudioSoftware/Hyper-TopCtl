[versions]
agp = "9.4.1"
# AGP 9 uses built-in Kotlin (the standalone org.jetbrains.kotlin.android plugin must NOT be
# applied). AGP's KGP 2.2.10 runtime dependency is a floor, not a ceiling: declaring the Compose
# compiler plugin at a higher version upgrades the built-in Kotlin compiler to match.
kotlin = "2.4.20"
coreKtx = "1.18.0"
coreSplashscreen = "1.2.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
# material3 pinned to the expressive alpha (MaterialExpressiveTheme / LargeFlexibleTopAppBar /
# MotionScheme), overriding the BOM. Matches KernelSU/ReSukiSU reference stack.
material3 = "1.5.0-alpha28"
materialKolor = "5.0.1"
kotlinxCoroutines = "1.10.2"

# Xposed (modern libxposed API 102 — LSPosed 2.x)
xposedApi = "102.0.0"
xposedService = "102.0.0"

# Miuix (HyperOS-style Compose UI). 0.9.2+ is built with Kotlin 2.4.0, so the Kotlin compiler
# must be 2.4+ to read its metadata.
miuix = "0.9.4"
hiddenApiBypass = "6.1"

[libraries]
# Xposed
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "xposedApi" }
libxposed-service = { group = "io.github.libxposed", name = "service", version.ref = "xposedService" }

# AndroidX / Compose
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# Dynamic color / Material You seed-based color scheme (materialkolor)
material-kolor = { group = "com.materialkolor", name = "material-kolor", version.ref = "materialKolor" }

# Hidden API compatibility (KernelSU Manager predictive-back behavior)
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenApiBypass" }

# Miuix
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui-android", version.ref = "miuix" }
miuix-nav = { module = "top.yukonga.miuix.kmp:miuix-nav-android", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons-android", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference-android", version.ref = "miuix" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
